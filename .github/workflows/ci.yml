name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Type check backend
        run: npm run build --prefix backend

      - name: Type check frontend
        run: npm run build --prefix frontend

      - name: Test backend
        run: npm test --prefix backend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Ecosystem UX prototype
        run: npx playwright test --config playwright.ecosystem.config.ts

      - name: Two-user household workflow
        run: npx playwright test --config playwright.household.config.ts

      - name: End-to-end accounting workflow
        run: npm run test:e2e
        env:
          WORKSPACE_PATH: ${{ runner.temp }}/comptaos-e2e-workspace
          AUTH_ENABLED: "false"
          NODE_ENV: test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

  local-server:
    name: Local Docker server and HTTPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Compose configuration
        run: docker compose --env-file deployment/local.env.example -f deployment/compose.local.yml config --quiet
      - name: Build and start local server
        run: docker compose --env-file deployment/local.env.example -f deployment/compose.local.yml up -d --build --wait
      - name: Retrieve local CA
        run: |
          for i in $(seq 1 30); do
            docker compose -f deployment/compose.local.yml cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/comptaos-ca.crt && break
            sleep 1
          done
          test -s /tmp/comptaos-ca.crt
      - name: Verify HTTPS, authentication, household and backup
        run: node deployment/smoke-local.mjs
      - name: Restart and verify persistence
        run: |
          docker compose -f deployment/compose.local.yml restart app
          node deployment/smoke-local.mjs
      - name: Container logs
        if: failure()
        run: docker compose -f deployment/compose.local.yml logs --tail=150
      - name: Stop test containers
        if: always()
        run: docker compose -f deployment/compose.local.yml down
