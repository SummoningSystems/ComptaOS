# Chargé dans le contexte http de Nginx. Les valeurs vides empêchent l'ajout
# des en-têtes sur les autres applications hébergées par tipforgood.com.
map $request_uri $comptaos_hsts {
    default "";
    ~^/comptaos(?:/|$) "max-age=31536000; includeSubDomains";
}

map $request_uri $comptaos_csp {
    default "";
    ~^/comptaos(?:/|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:";
}

map $request_uri $comptaos_frame_options {
    default "";
    ~^/comptaos(?:/|$) "DENY";
}

map $request_uri $comptaos_content_type_options {
    default "";
    ~^/comptaos(?:/|$) "nosniff";
}

map $request_uri $comptaos_referrer_policy {
    default "";
    ~^/comptaos(?:/|$) "strict-origin-when-cross-origin";
}

map $request_uri $comptaos_permissions_policy {
    default "";
    ~^/comptaos(?:/|$) "camera=(), microphone=(), geolocation=(), payment=()";
}

add_header Strict-Transport-Security $comptaos_hsts always;
add_header Content-Security-Policy $comptaos_csp always;
add_header X-Frame-Options $comptaos_frame_options always;
add_header X-Content-Type-Options $comptaos_content_type_options always;
add_header Referrer-Policy $comptaos_referrer_policy always;
add_header Permissions-Policy $comptaos_permissions_policy always;
