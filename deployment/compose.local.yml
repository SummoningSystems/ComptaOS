name: comptaos-local
services:
  app:
    build:
      context: ..
      dockerfile: deployment/local.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_ENABLED: "true"
      HTTPS_ONLY: "true"
      WORKSPACE_PATH: /data/workspace
      BACKUP_PATH: /backups
      OCR_LOCAL_URL: ${OCR_LOCAL_URL:-}
      OCR_REMOTE_FALLBACK: "false"
    volumes:
      - data:/data
      - backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COMPTAOS_ADDRESS: ${COMPTAOS_ADDRESS:-localhost}
    ports:
      - "${COMPTAOS_BIND_IP:-127.0.0.1}:443:443"
      - "${COMPTAOS_BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
